openapi: 3.0.3
info:
  title: Finance API
  version: 2.3.0
  description: |
    API contract của finance-backend, là single source of truth: backend generate server interface,
    app mobile generate client từ file này.

    Authentication
    - Token do Keycloak issue (Authorization Code + PKCE). API này không có endpoint login,
      register hay refresh token — tất cả diễn ra ở Keycloak (ADR-004).
    - Gửi access token qua `Authorization: Bearer <token>`. Claim `aud` phải chứa `finance-api`.

    Quy ước
    - Mọi write endpoint (POST / PUT / PATCH) bắt buộc header `Idempotency-Key` (UUID). Gửi lại cùng key
      và cùng payload thì nhận lại response cũ; khác payload thì 422.
    - Error theo RFC 7807 `application/problem+json`, kèm `code` ổn định, machine-readable.
    - Tiền không bao giờ là float: integer theo minor units + currency code ISO-4217.

    Đồng bộ (2.1.0, chỉ thêm, không breaking, ADR-002)
    - App chỉ ghi dữ liệu sổ thu chi qua `POST /api/v1/sync/push`, kéo thay đổi qua `GET /api/v1/sync/pull`.
    - Dữ liệu từng entity: `AccountData`, `CategoryData`, `TransactionData`. Field lạ, kể cả field do server
      quản lý (`userId`, `changeSeq`, `version`, `createdAt`...), làm op đó bị `REJECTED`.
    - Giới hạn: push 60 lần/phút, pull 120 lần/phút mỗi user (vượt → 429 + `Retry-After`); push tối đa
      100 op và 256 KB.

    Ngân sách (2.2.0, chỉ thêm, không breaking, ADR-007)
    - Entity sync mới `budget`, dữ liệu `BudgetData`. Ghi qua `/sync/push` như ledger, không có REST riêng.
    - `categoryId`, `currency`, `startMonth` không đổi được sau khi tạo (`REJECTED budget.immutable_field`).
    - Mỗi cặp (danh mục, tiền tệ) tối đa 1 ngân sách; bản tới sau nhận `REJECTED budget.duplicate`.
    - "Đã chi" không có trong contract: app tự tính từ giao dịch local.

    Khoản định kỳ (2.3.0, chỉ thêm, không breaking, ADR-008)
    - Entity sync mới `recurring`, dữ liệu `RecurringData` gồm cả timeline phiên bản (`revisions`).
    - Ghi có điều kiện: `RecurringData.revision` trong op là revision client dựa vào (tạo mới = 0); khác server
      → `CONFLICT recurring.revision_conflict` + `current`. Phiên bản đã có hiệu lực không sửa được.
    - Op mới `action: CREATE` cho mọi entity: chỉ ghi khi id chưa có. Id đã có (kể cả tombstone) →
      `CONFLICT sync.already_exists` + `current`. App dùng cho giao dịch sinh từ khoản định kỳ, id
      `UUIDv5(9ec1e9e3-0bb0-485a-ba55-77182d53d5f4, "<recurringId>/<yyyy-MM-dd>")`.
    - Server không tự sinh giao dịch; app sinh khi đến hạn.

    Breaking changes so với 1.0.0
    - Xoá `/api/v1/auth/register`, `/login`, `/refresh`, `/logout` cùng các schema đi kèm.
    - `UserProfile.id` là internal id, không phải `sub` của Keycloak.
servers:
  - url: http://localhost:18473
    description: Môi trường local
tags:
  - name: me
    description: Current user
  - name: sync
    description: Đồng bộ offline-first giữa app và server (ADR-002)
# Chỉ khai http bearer. KHÔNG thêm scheme `openIdConnect`: generator Kotlin multiplatform 7.14 sinh code
# sai cú pháp cho scheme đó (`mapOf(, ...`), làm gãy build của finance-mobile.
security:
  - bearerAuth: []
paths:
  /api/v1/me:
    get:
      tags: [me]
      operationId: getCurrentUser
      summary: Profile của user đang login
      description: Lần gọi đầu tiên với một account Keycloak mới sẽ tự provision local account.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/sync/push:
    post:
      tags: [sync]
      operationId: pushChanges
      summary: Gửi các thay đổi ghi offline lên server
      description: |
        Mỗi op được xử lý trong một transaction riêng; op lỗi không làm hỏng op khác. Kết quả trả theo
        từng op, luôn kèm `current` là bản ghi hiện tại trên server (null nếu không có hoặc không phải của
        bạn). Gửi lại cùng `opId` trong 30 ngày nhận `DUPLICATE`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Kết quả từng op, cùng thứ tự với request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/sync/pull:
    get:
      tags: [sync]
      operationId: pullChanges
      summary: Kéo các thay đổi kể từ cursor lần trước
      description: |
        Trả thay đổi của chính user, tăng dần theo `changeSeq`, kể cả bản ghi đã xoá (`deleted = true`).
        Gọi lặp tới khi `hasMore = false`. Một trang có thể chứa giao dịch trước ví của nó.
      parameters:
        - name: since
          in: query
          required: false
          description: '`nextCursor` của lần pull trước. Bỏ trống = từ đầu. Chuỗi opaque, không tự tính.'
          schema:
            type: string
            maxLength: 32
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Một trang thay đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`sync.cursor_ahead`: cursor lớn hơn dữ liệu trên server (server được khôi phục). Xoá cursor rồi pull lại từ đầu.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token do Keycloak issue cho client `finance-mobile`.
        Discovery (local): http://localhost:8081/realms/finance/.well-known/openid-configuration
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID do client generate, unique cho mỗi thao tác. Khi retry thì gửi lại y nguyên.
      schema:
        type: string
        format: uuid
  schemas:
    UserProfile:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Internal id, là key của mọi business data. Không phải `sub` của Keycloak.
        email:
          type: string
          format: email
          description: Bản copy từ Keycloak, sync trễ tối đa vài phút sau khi đổi.
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Thời điểm local account được tạo (lần đầu gọi API), không phải lúc register trên Keycloak.
    SyncPushRequest:
      type: object
      required: [deviceId, ops]
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Id cố định của cài đặt app trên máy, dùng cho nhật ký (ADR-006 B9)
        ops:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncOperation'
    SyncOperation:
      type: object
      required: [opId, entity, id, action]
      properties:
        opId:
          type: string
          format: uuid
          description: Do client sinh, duy nhất cho mỗi op. Gửi lại y nguyên khi retry.
        entity:
          type: string
          minLength: 1
          maxLength: 30
          description: '`account` | `category` | `transaction` | `budget` | `recurring`. Giá trị khác → op bị `REJECTED sync.unknown_entity`.'
          example: transaction
        id:
          type: string
          format: uuid
          description: Id bản ghi, do client sinh
        action:
          type: string
          enum: [UPSERT, DELETE, CREATE]
          description: |
            `UPSERT`: tạo hoặc sửa. `DELETE`: tombstone. `CREATE` (2.3.0): chỉ tạo khi id chưa có với user;
            id đã có, còn sống hay đã xoá → `CONFLICT sync.already_exists` + `current`, bản của server giữ
            nguyên. Id của user khác bị từ chối như `UPSERT`.
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Bắt buộc khi `UPSERT` và `CREATE`, bỏ qua khi `DELETE`. Hình dạng theo `entity`: `AccountData`,
            `CategoryData`, `TransactionData`, `BudgetData` hoặc `RecurringData`. Không được có field nào khác.
    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncOpResult'
    SyncOpResult:
      type: object
      required: [opId, outcome]
      properties:
        opId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [APPLIED, DUPLICATE, CONFLICT, REJECTED, RETRY]
          description: |
            APPLIED: đã ghi. DUPLICATE: opId đã xử lý trước đó. CONFLICT: server giữ bản của mình (đã xoá,
            id đã có khi `CREATE`, hoặc `recurring.revision_conflict`), ghi đè local bằng `current`. REJECTED: bỏ op, khôi phục local theo `current`, báo user.
            RETRY: ví/danh mục được trỏ tới chưa tới, giữ op và thử lại sau.
        code:
          type: string
          nullable: true
          description: Mã lỗi khi REJECTED / CONFLICT / RETRY, ví dụ `ledger.in_use`
        current:
          $ref: '#/components/schemas/SyncChange'
    SyncPullResponse:
      type: object
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        nextCursor:
          type: string
          description: Gửi lại ở tham số `since` của lần pull sau
        hasMore:
          type: boolean
    SyncChange:
      type: object
      nullable: true
      required: [entity, id, changeSeq, deleted]
      properties:
        entity:
          type: string
          example: account
        id:
          type: string
          format: uuid
        changeSeq:
          type: integer
          format: int64
        deleted:
          type: boolean
          description: Tombstone. Máy khác phải xoá bản ghi này theo.
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: '`AccountData` / `CategoryData` / `TransactionData` / `BudgetData` / `RecurringData`; null khi `deleted = true`.'
    AccountData:
      type: object
      additionalProperties: false
      required: [name, type, currency, openingBalanceMinor, sortOrder, archived]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        type:
          type: string
          enum: [CASH, BANK, EWALLET, OTHER]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO-4217. Khoá lại khi ví đã có giao dịch.
        openingBalanceMinor:
          type: integer
          format: int64
          minimum: -1000000000000000
          maximum: 1000000000000000
        sortOrder:
          type: integer
          format: int32
        archived:
          type: boolean
    CategoryData:
      type: object
      additionalProperties: false
      required: [kind, name, archived]
      properties:
        kind:
          type: string
          enum: [INCOME, EXPENSE]
          description: Không đổi được sau khi tạo
        name:
          type: string
          minLength: 1
          maxLength: 50
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Tối đa 2 cấp, cha phải cùng kind
        icon:
          type: string
          nullable: true
          pattern: '^[a-z0-9_]{1,50}$'
        color:
          type: string
          nullable: true
          pattern: '^#[0-9A-Fa-f]{6}$'
        archived:
          type: boolean
        templateKey:
          type: string
          nullable: true
          readOnly: true
          description: Chỉ có ở danh mục mặc định (ví dụ `fee`). Server điền, client gửi lên sẽ bị REJECTED.
    TransactionData:
      type: object
      additionalProperties: false
      required: [type, status, accountId, amountMinor, currency, occurredOn]
      properties:
        type:
          type: string
          enum: [INCOME, EXPENSE, TRANSFER]
        status:
          type: string
          enum: [CONFIRMED, DRAFT]
        accountId:
          type: string
          format: uuid
          description: Ví (với TRANSFER là ví đi)
        counterAccountId:
          type: string
          format: uuid
          nullable: true
          description: Ví đến, bắt buộc khi TRANSFER
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000000
          description: Luôn dương; chiều tiền do `type` quyết định
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: Bắt buộc khi INCOME/EXPENSE, phải null khi TRANSFER
        occurredOn:
          type: string
          format: date
          description: Ngày theo lịch của user
        occurredAt:
          type: string
          format: date-time
          nullable: true
        payee:
          type: string
          nullable: true
          maxLength: 100
        note:
          type: string
          nullable: true
          maxLength: 500
    BudgetData:
      type: object
      additionalProperties: false
      required: [categoryId, currency, amountMinor, startMonth]
      properties:
        categoryId:
          type: string
          format: uuid
          description: |
            Danh mục chi cấp 1 (`kind = EXPENSE`, `parentId = null`) của chính user. Không đổi được sau khi tạo.
            Danh mục chưa tới → `RETRY budget.reference_pending`.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO-4217. Không đổi được sau khi tạo.
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000000
          description: Mức chi tối đa mỗi tháng, áp cho mọi tháng từ `startMonth`
        startMonth:
          type: string
          format: date
          description: |
            Ngày 1 của tháng bắt đầu áp dụng, từ 2000-01-01 tới tháng UTC hiện tại + 1. Không đổi được
            sau khi tạo.
    RecurringData:
      type: object
      additionalProperties: false
      required: [name, type, currency, generationNotBefore, revision, revisions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Tên hiển thị, trim. Sửa được; được chụp vào `payee` của giao dịch lúc sinh.
        type:
          type: string
          enum: [EXPENSE, INCOME]
          description: Không đổi được sau khi tạo.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO-4217, phải trùng tiền tệ của ví ở mọi phiên bản. Không đổi được sau khi tạo.
        generationNotBefore:
          type: string
          format: date
          description: |
            Không sinh kỳ trước ngày này. Chỉ được tăng, giá trị mới tối đa hôm nay (UTC) + 1. Giảm →
            `REJECTED recurring.immutable_field`.
        generationEndDate:
          type: string
          format: date
          nullable: true
          description: |
            Ngày cuối còn sinh kỳ. Chỉ được giảm, giá trị mới tối thiểu hôm nay (UTC) − 1; nhỏ hơn kỳ đầu =
            huỷ khoản chưa bắt đầu. Đã đặt thì không gỡ về null, không tăng.
        remindDaysBefore:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          maximum: 7
          description: Nhắc trước bao nhiêu ngày; null = tắt. Sửa được.
        revision:
          type: integer
          format: int64
          minimum: 0
          description: |
            Trong op: revision mà client dựa vào (tạo mới = 0); khác server → `CONFLICT
            recurring.revision_conflict`. Trong pull và `current`: revision hiện tại. Server tự tăng 1 mỗi lần áp.
        revisions:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            Timeline, `effectiveFrom` tăng dần, không trùng. Phiên bản có `effectiveFrom` trước hôm nay (UTC)
            − 1 phải giữ nguyên; phiên bản thêm hoặc sửa có `effectiveFrom` từ hôm nay (UTC) − 1 tới + 366
            ngày (khi tạo mới: từ 2000-01-01).
          items:
            $ref: '#/components/schemas/RecurrenceRevisionData'
    RecurrenceRevisionData:
      type: object
      additionalProperties: false
      required: [id, effectiveFrom, anchorDate, accountId, categoryId, amountMinor, frequency, interval, autoConfirm]
      properties:
        id:
          type: string
          format: uuid
          description: Do client sinh, cố định cho phiên bản
        effectiveFrom:
          type: string
          format: date
          description: Phiên bản áp từ ngày này tới trước `effectiveFrom` của phiên bản kế tiếp
        anchorDate:
          type: string
          format: date
          description: |
            Mốc nhịp lặp: tuần ISO / tháng / năm chứa ngày này là kỳ 0, lấy kỳ cách nó bội số của `interval`.
            Không sau `effectiveFrom`.
        accountId:
          type: string
          format: uuid
          description: Ví của chính user, cùng `currency`. Chưa tới → `RETRY recurring.reference_pending`.
        categoryId:
          type: string
          format: uuid
          description: Danh mục cùng loại với `type`, cấp nào cũng được. Chưa tới → `RETRY recurring.reference_pending`.
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000000
          description: Số tiền dự kiến mỗi kỳ
        note:
          type: string
          nullable: true
          maxLength: 500
        frequency:
          type: string
          enum: [WEEKLY, MONTHLY, YEARLY]
        interval:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          description: Mỗi bao nhiêu tuần / tháng / năm
        weekday:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 7
          description: ISO, 1 = thứ Hai. Bắt buộc khi WEEKLY, null với tần suất khác.
        month:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 12
          description: Bắt buộc khi YEARLY, null với tần suất khác.
        dayOfMonth:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 31
          description: |
            Bắt buộc khi MONTHLY và YEARLY, null khi WEEKLY. Tháng không có ngày này thì lùi về ngày cuối tháng.
        autoConfirm:
          type: boolean
          description: Kỳ đúng hôm nay được ghi `CONFIRMED` thay vì `DRAFT`. Kỳ bù luôn là `DRAFT`.
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: RFC 7807 Problem Details, thêm `code` ổn định, machine-readable
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          description: Error code ổn định, ví dụ `auth.unauthenticated`
          example: auth.unauthenticated
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    BadRequest:
      description: Request malformed hoặc không pass validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Thiếu token, token expired, hoặc sai signature / issuer / audience
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Resource đã tồn tại
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Body vượt giới hạn của endpoint
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Vượt giới hạn tần suất của user. Chờ đúng `Retry-After` giây rồi gửi lại.
      headers:
        Retry-After:
          description: Số giây phải chờ
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
