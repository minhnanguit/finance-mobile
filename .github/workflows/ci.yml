name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android:
    name: Android build · unit tests · architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Show Gradle environment
        run: |
          ./gradlew --version
          echo "=== Gradle daemon JVM config ==="
          cat gradle/gradle-daemon-jvm.properties 2>/dev/null || true
          echo "=== Java-related Gradle properties ==="
          grep -R "org.gradle.java.home\|toolchainVersion\|javaVersion" \
            gradle.properties gradle 2>/dev/null || true

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Unit tests (all KMP modules, Android/JVM target)
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Architecture tests (Konsist)
        run: ./gradlew :architecture-test:test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug.apk
          path: composeApp/build/outputs/apk/debug/*.apk

  ios:
    name: iOS framework · Xcode build (simulator)
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Show Gradle environment
        run: |
          ./gradlew --version
          echo "=== Gradle daemon JVM config ==="
          cat gradle/gradle-daemon-jvm.properties 2>/dev/null || true
          echo "=== Java-related Gradle properties ==="
          grep -R "org.gradle.java.home\|toolchainVersion\|javaVersion" \
            gradle.properties gradle 2>/dev/null || true

      # Kotlin / Compose Multiplatform project requires Xcode 26
      # for the iOS 26 SDK APIs used during linking.
      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -1)"

          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this runner"
            ls -d /Applications/Xcode*.app
            exit 1
          fi

          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Link Kotlin framework for the simulator
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate

      - name: Build iOS app (no signing)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build