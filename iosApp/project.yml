# XcodeGen spec. Generate the project with:  brew install xcodegen && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: com.uit.finance
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"     # the Gradle build phase writes into composeApp/build
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: $(APP_NAME)
        DEVELOPMENT_TEAM: $(TEAM_ID)
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1"
        # The Kotlin framework is produced by the Gradle build phase below.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework ComposeApp
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
