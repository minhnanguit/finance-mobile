# XcodeGen spec. Generate the project with:  brew install xcodegen && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: com.uit.finance
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig
# SQLCipher thay cho libsqlite3 của hệ thống: DB của mỗi user được mã hoá (ADR-006 B6).
# Cùng phiên bản với net.zetetic:sqlcipher-android trong gradle/libs.versions.toml.
packages:
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift
    exactVersion: 4.19.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"     # the Gradle build phase writes into composeApp/build
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: $(APP_NAME)
        DEVELOPMENT_TEAM: $(TEAM_ID)
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1"
        # KMP only declares iosSimulatorArm64 (no iosX64), so never build the Intel simulator slice.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # The Kotlin framework is produced by the Gradle build phase below.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # ComposeApp is a static framework, so its native deps are linked here. The sqlite3 symbols that SQLDelight's
        # NativeSqliteDriver needs come from SQLCipher (package below), NOT -lsqlite3: linking the system SQLite would
        # leave the database unencrypted. UserDatabaseManager refuses to open a DB if `PRAGMA cipher_version` is empty.
        OTHER_LDFLAGS: $(inherited) -framework ComposeApp
    dependencies:
      - package: SQLCipher
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
