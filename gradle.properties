org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.caching=false
# Keep the included build-logic jar deterministic; stale/cached build-logic
# outputs can leave plugin descriptors without their implementation classes.
org.gradle.vfs.watch=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# iOS targets are silently skipped on hosts without Xcode / on Linux CI.
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
