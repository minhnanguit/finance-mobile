# Keep the Gradle runtime aligned with Java 21 in CI.
# Install JDK 21 locally; CI provisions it with actions/setup-java.
# No download URLs: use the installed JDK instead of an implicit JDK download.
toolchainVersion=21
# Pin vendor: with only a version, Gradle may pick any auto-detected Java 21 (e.g. the JRE bundled with
# the VS Code Java extension, which has no jlink) and the Android JDK image transform then fails.
toolchainVendor=ADOPTIUM
